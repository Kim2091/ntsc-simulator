[package]
name = "ntsc-composite-simulator"
version = "0.1.0"
edition = "2021"
description = "NTSC composite video simulator — encode and decode RGB frames through a simulated NTSC signal path"

[dependencies]
realfft = "3"
rayon = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
indicatif = "0.17"
anyhow = "1"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.37", optional = true }
rfd = { version = "0.17", optional = true }

[features]
default = ["gui"]
# The GUI binary (ntsc-gui). Build the CLI alone with --no-default-features.
gui = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "ntsc-composite-simulator"
path = "src/main.rs"

[[bin]]
name = "ntsc-gui"
path = "src/bin/ntsc-gui/main.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
